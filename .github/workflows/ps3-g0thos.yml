name: PS3 G0THOS

on:
  push:
    paths: ["ps3-g0thos/**", ".github/workflows/ps3-g0thos.yml"]
  pull_request:
    paths: ["ps3-g0thos/**", ".github/workflows/ps3-g0thos.yml"]
  workflow_dispatch:

jobs:
  ps3:
    name: Build .self and .pkg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with PSL1GHT
        run: |
          docker run --rm -v "$PWD/ps3-g0thos:/src" -w /src flipacholas/ps3devextra:latest \
            sh -c 'make && make pkg'
          ls -la ps3-g0thos/*.self ps3-g0thos/*.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: g0thos-ps3
          path: |
            ps3-g0thos/g0thos.self
            ps3-g0thos/g0thos.pkg
            ps3-g0thos/g0thos.gnpdrm.pkg

  preview:
    name: Desktop preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render screenshots
        working-directory: ps3-g0thos/sim
        run: |
          sudo apt-get install -y libpng-dev && pip install pillow
          python3 make_mock.py mock/game
          make
          ./g0thos-sim -r 1920x1080 -g mock/game -o shot 'w100,shot,R,R,w50,shot,R1,w50,shot,R1,X,w60,shot,ST,w20,R,R,X,w40,shot'
          python3 -c "import glob; from PIL import Image; [Image.open(f).save(f[:-4] + '.png') for f in glob.glob('shot*.ppm')]"
      - uses: actions/upload-artifact@v4
        with:
          name: g0thos-preview
          path: ps3-g0thos/sim/shot*.png
